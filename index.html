<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carpet Cutting Planner</title><style>body{margin:0;font:14px system-ui;background:#f4f6f8;color:#17202b}*{box-sizing:border-box}button,input,select{font:inherit}button{padding:8px 11px;border:1px solid #d9dee6;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff}.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#fff;border-bottom:1px solid #d9dee6;display:flex;align-items:center;gap:14px;padding:0 16px}.brand{font-weight:750;font-size:17px}.project{color:#667085;border-left:1px solid #ddd;padding-left:14px}.stats{margin-left:auto;display:flex;gap:20px}.stats span{display:block;color:#667085;font-size:11px}.stats b{font-size:14px}.body{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 250px}.side{background:#fff;padding:14px;border-right:1px solid #d9dee6;overflow:auto}.right{border-left:1px solid #d9dee6;border-right:0}h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#667085;margin:4px 0 9px}.section{margin-bottom:18px}.room{border:1px solid #d9dee6;border-radius:8px;padding:9px;margin-bottom:8px}.room strong{display:block}.small{font-size:12px;color:#667085}.row{display:flex;gap:7px}.row>*{flex:1}.thumb{height:65px;background:#fafafa;border:1px solid #eee;border-radius:6px;margin-bottom:7px;display:grid;place-items:center}.canvas{overflow:auto;background:#eef1f4}.toolbar{height:48px;background:#fff;border-bottom:1px solid #d9dee6;display:flex;align-items:center;gap:7px;padding:0 12px;position:sticky;top:0;z-index:4}.work{padding:38px;min-width:700px}.roll{position:relative;margin:auto;background:#fafafa;border:2px solid #555}.grid{position:absolute;inset:0;background-image:linear-gradient(#e1e5e9 1px,transparent 1px),linear-gradient(90deg,#e1e5e9 1px,transparent 1px)}.piece{position:absolute;cursor:grab;touch-action:none}.piece svg{overflow:visible}.piece.selected path{stroke:#2563eb;stroke-width:3}.piece.bad path{stroke:#dc2626;stroke-width:3}.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;text-align:center;pointer-events:none}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:4px}.field input,.field select{width:100%;padding:7px;border:1px solid #d9dee6;border-radius:6px}.notice{padding:9px;border-radius:7px;background:#fff4e5;color:#9a3412;font-size:12px}.ok{background:#ecfdf3;color:#166534}.modalbg{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:20}.modal{background:#fff;width:min(900px,94vw);max-height:92vh;overflow:auto;border-radius:12px;padding:18px}.drawbox{height:390px;border:1px solid #d9dee6;border-radius:8px;background-color:#fafafa;background-image:linear-gradient(#e1e5e9 1px,transparent 1px),linear-gradient(90deg,#e1e5e9 1px,transparent 1px);background-size:25px 25px;margin:12px 0}.drawgrid{display:grid;grid-template-columns:1fr 280px;gap:16px}.dimensionShape{border:1px solid #d9dee6;border-radius:8px;background:#fafafa;padding:8px;min-height:360px}.dims{border:1px solid #d9dee6;border-radius:7px;padding:9px;max-height:430px;overflow:auto}.dim{display:grid;grid-template-columns:42px 1fr 115px;gap:8px;margin-bottom:8px;align-items:center;padding:8px;border-radius:7px;border:1px solid transparent}.dim.active{border-color:#2563eb;background:#eff6ff}.dim .num{font-weight:750}.dir{font-size:11px;color:#667085}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.toast{position:fixed;right:18px;bottom:18px;background:#17202b;color:#fff;padding:10px 13px;border-radius:8px;z-index:30}@media(max-width:900px){.body{grid-template-columns:210px 1fr}.right{display:none}.stats{gap:8px}.drawgrid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>
const KEY='ccp-v2';let S={project:'Carpet Cutting Plan',roll:4000,grid:50,snap:true,rooms:[],pieces:[],selected:null,zoom:.5,modal:null,_draw:[]};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}const uid=()=>crypto.randomUUID(),save=()=>localStorage.setItem(KEY,JSON.stringify(S)),fmt=n=>Math.round(n).toLocaleString()+' mm';
function box(p){let xs=p.map(a=>a.x),ys=p.map(a=>a.y);return{minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}function ar(p){let a=0;for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length];a+=p[i].x*q.y-q.x*p[i].y}return Math.abs(a/2)}function cross(a,b,c,d){let o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x),a1=o(a,b,c),a2=o(a,b,d),a3=o(c,d,a),a4=o(c,d,b);return a1*a2<0&&a3*a4<0}function inside(p,q){let z=false;for(let i=0,j=q.length-1;i<q.length;j=i++){let a=q[i],b=q[j];if((a.y>p.y)!=(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)z=!z}return z}function collide(a,b){for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(cross(a[i],a[(i+1)%a.length],b[j],b[(j+1)%b.length]))return true;return inside(a[0],b)||inside(b[0],a)}function transformed(x){let r=S.rooms.find(a=>a.id===x.roomId),p=r.vertices,b=box(p),cx=b.w/2,cy=b.h/2,t=x.rotation*Math.PI/180;return p.map(v=>{let X=v.x-cx,Y=v.y-cy;return{x:X*Math.cos(t)-Y*Math.sin(t)+cx+x.x,y:X*Math.sin(t)+Y*Math.cos(t)+cy+x.y}})}function valid(x){let p=transformed(x),b=box(p);if(b.minX<0||b.maxX>S.roll)return false;return !S.pieces.some(o=>o.id!==x.id&&collide(p,transformed(o)))}function svg(p,w=170,h=60,labels=false){let b=box(p),s=Math.min((w-10)/Math.max(1,b.w),(h-10)/Math.max(1,b.h)),d=p.map((v,i)=>(i?'L':'M')+((v.x-b.minX)*s+5)+' '+((v.y-b.minY)*s+5)).join(' ')+' Z';return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${d}" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>${labels?p.map((v,i)=>{let q=p[(i+1)%p.length];return`<text x="${((v.x+q.x)/2-b.minX)*s+5}" y="${((v.y+q.y)/2-b.minY)*s+5}" font-size="11" font-weight="700" text-anchor="middle">${i+1}</text>`}).join(''):''}</svg>`}
function render(){let ys=S.pieces.length?Math.max(...S.pieces.flatMap(p=>transformed(p).map(v=>v.y))):0,len=Math.max(2000,ys+400),used=S.pieces.reduce((n,p)=>n+ar(transformed(p)),0),waste=(S.roll*len)?Math.max(0,S.roll*len-used)/(S.roll*len)*100:0;app.innerHTML=`<div class="app"><header class="top"><div class="brand">Carpet Cutting Planner</div><div class="project">${S.project}</div><div class="stats"><div><span>Roll width</span><b>${fmt(S.roll)}</b></div><div><span>Required length</span><b>${fmt(ys)}</b></div><div><span>Waste</span><b>${waste.toFixed(1)}%</b></div></div><button onclick="newPlan()">New</button><button onclick="save();toast('Saved')">Save</button></header><div class="body"><aside class="side"><div class="section"><h3>Rooms</h3><button class="primary" style="width:100%" onclick="startDraw()">+ Add room</button></div>${S.rooms.map(r=>`<div class="room"><div class="thumb">${svg(r.vertices)}</div><strong>${r.name}</strong><div class="small">${fmt(box(r.vertices).w)} × ${fmt(box(r.vertices).h)} · ${(ar(r.vertices)/1e6).toFixed(2)}m²</div><div class="row" style="margin-top:7px"><button draggable="true" ondragstart="event.dataTransfer.setData('room','${r.id}')">Drag</button><button onclick="editRoom('${r.id}')">Edit</button></div></div>`).join('')||'<div class="small">No rooms yet.</div>'}<div class="section"><h3>Roll settings</h3><div class="field"><label>Width (mm)</label><input type="number" value="${S.roll}" onchange="S.roll=+this.value||4000;save();render()"></div><div class="field"><label>Grid (mm)</label><select onchange="S.grid=+this.value;save();render()"><option ${S.grid==25?'selected':''}>25</option><option ${S.grid==50?'selected':''}>50</option><option ${S.grid==100?'selected':''}>100</option></select></div><label class="small"><input type="checkbox" ${S.snap?'checked':''} onchange="S.snap=this.checked"> Snap to grid</label></div><div class="section"><h3>Project</h3><div class="field"><label>Name</label><input value="${S.project}" onchange="S.project=this.value;save();render()"></div></div></aside><main class="canvas" ondragover="event.preventDefault()" ondrop="drop(event)"><div class="toolbar"><b>Cutting plan</b><span class="small">Drag rooms onto the roll.</span><span style="margin-left:auto"><button onclick="S.zoom=Math.max(.25,S.zoom-.1);render()">−</button> ${Math.round(S.zoom*100)}% <button onclick="S.zoom=Math.min(1.5,S.zoom+.1);render()">+</button><button onclick="autoArrange()">Auto arrange</button></span></div><div class="work"><div class="roll" style="width:${S.roll*S.zoom}px;height:${len*S.zoom}px"><div class="grid" style="background-size:${S.grid*S.zoom}px ${S.grid*S.zoom}px"></div>${S.pieces.map(piece).join('')}</div></div></main><aside class="side right">${panel()}</aside></div>${S.modal||''}</div>`}
function piece(x){let r=S.rooms.find(a=>a.id===x.roomId),p=transformed(x),b=box(p),d=p.map((v,i)=>(i?'L':'M')+((v.x-b.minX)*S.zoom)+' '+((v.y-b.minY)*S.zoom)).join(' ')+' Z';return`<div class="piece ${x.id===S.selected?'selected':''} ${valid(x)?'':'bad'}" style="left:${b.minX*S.zoom}px;top:${b.minY*S.zoom}px;width:${b.w*S.zoom}px;height:${b.h*S.zoom}px" onpointerdown="grab(event,'${x.id}')" onclick="S.selected='${x.id}';event.stopPropagation();render()"><svg width="${b.w*S.zoom}" height="${b.h*S.zoom}"><path d="${d}" fill="#dbeafe" stroke="#334155"/></svg><div class="label">${r.name}<br>${fmt(b.w)} × ${fmt(b.h)}</div></div>`}function panel(){let p=S.pieces.find(a=>a.id===S.selected);if(!p)return'<h3>Selection</h3><div class="small">Select a room on the roll to edit it.</div>';let r=S.rooms.find(a=>a.id===p.roomId);return`<h3>Selected room</h3><strong>${r.name}</strong><div class="small">Area ${(ar(r.vertices)/1e6).toFixed(2)}m²</div><div style="margin-top:14px"><div class="field"><label>X (mm)</label><input type="number" value="${Math.round(p.x)}" onchange="pById('${p.id}').x=+this.value;save();render()"></div><div class="field"><label>Y (mm)</label><input type="number" value="${Math.round(p.y)}" onchange="pById('${p.id}').y=+this.value;save();render()"></div><div class="field"><label>Rotation</label><select onchange="pById('${p.id}').rotation=+this.value;save();render()">${[0,90,180,270].map(n=>`<option value="${n}" ${p.rotation===n?'selected':''}>${n}°</option>`).join('')}</select></div><button style="width:100%" onclick="rotate('${p.id}')">Rotate 90°</button><button style="width:100%;margin-top:7px;color:#dc2626" onclick="removePiece('${p.id}')">Remove</button></div><div style="margin-top:14px" class="notice ${valid(p)?'ok':''}">${valid(p)?'Valid placement':'Invalid placement'}</div>`}function pById(id){return S.pieces.find(p=>p.id===id)}function removePiece(id){S.pieces=S.pieces.filter(p=>p.id!==id);S.selected=null;save();render()}function rotate(id){let p=pById(id),old=p.rotation;p.rotation=(old+90)%360;if(!valid(p)){p.rotation=old;toast('Invalid rotation')}save();render()}function grab(e,id){e.preventDefault();let p=pById(id),sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y;S.selected=id;function mv(v){let x=ox+(v.clientX-sx)/S.zoom,y=oy+(v.clientY-sy)/S.zoom;if(S.snap){x=Math.round(x/S.grid)*S.grid;y=Math.round(y/S.grid)*S.grid}p.x=x;p.y=y;render()}function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(!valid(p)){p.x=ox;p.y=oy;toast('Invalid placement')}save();render()}document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)}function drop(e){let id=e.dataTransfer.getData('room');if(!id)return;let el=e.currentTarget.querySelector('.roll'),b=el.getBoundingClientRect(),r=S.rooms.find(x=>x.id===id),rb=box(r.vertices),p={id:uid(),roomId:id,x:(e.clientX-b.left)/S.zoom-rb.w/2,y:(e.clientY-b.top)/S.zoom-rb.h/2,rotation:0};S.pieces.push(p);S.selected=p.id;if(!valid(p)){p.x=Math.max(0,Math.min(S.roll-rb.w,p.x));p.y=Math.max(0,p.y)}save();render()}function autoArrange(){let y=0;for(let p of S.pieces){p.rotation=0;let b=box(S.rooms.find(r=>r.id===p.roomId).vertices);p.x=0;p.y=y;y+=b.h}save();render();toast('Basic arrangement created')}
function startDraw(){S._draw=[];S.modal=`<div class="modalbg"><div class="modal"><h2>Draw room</h2><div class="small">Click each corner in order. The next wall is automatically made horizontal or vertical. The first point is green.</div><div class="drawbox" id="draw"><svg width="100%" height="100%" viewBox="0 0 700 390" onclick="drawPoint(event)">${drawPath()}</svg></div><div class="actions"><button onclick="closeDraw()">Close shape</button><button onclick="S.modal=null;render()">Cancel</button><button class="primary" onclick="toDims()">Continue</button></div><div id="drawerr" style="margin-top:8px"></div></div></div>`;render()}function closeDraw(){let p=S._draw;if(p.length<4){toast('Add at least 4 corners');return}p.closed=true;updateDraw()}function drawPath(){let p=S._draw||[],path=p.length?p.map((a,i)=>(i?'L':'M')+a.x+' '+a.y).join(' ')+(p.closed?' Z':''):'';return`${path?`<path d="${path}" fill="${p.closed?'#bfdbfe':'#dbeafe55'}" stroke="#2563eb" stroke-width="2"/>`:''}${p.map((a,i)=>`<circle cx="${a.x}" cy="${a.y}" r="7" fill="${i===0?'#16a34a':'#2563eb'}"/><text x="${a.x+10}" y="${a.y-9}" font-size="12" font-weight="700">${i+1}</text>`).join('')}${p.length>1&&!p.closed?`<line x1="${p.at(-1).x}" y1="${p.at(-1).y}" x2="${p[0].x}" y2="${p[0].y}" stroke="#94a3b8" stroke-dasharray="6 5"/>`:''}`}
function updateDraw(){let d=document.getElementById('draw');if(d)d.innerHTML=`<svg width="100%" height="100%" viewBox="0 0 700 390" onclick="drawPoint(event)">${drawPath()}</svg>`}function drawPoint(e){let p=S._draw;if(p.closed)return;let b=e.currentTarget.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*700,y=(e.clientY-b.top)/b.height*390;if(p.length){let q=p.at(-1);if(Math.abs(x-q.x)>=Math.abs(y-q.y))y=q.y;else x=q.x;if(p.length>=3&&Math.hypot(x-p[0].x,y-p[0].y)<22){closeDraw();return}}p.push({x,y});updateDraw()}
function wallInfo(p,i){let q=p[(i+1)%p.length],dx=q.x-p[i].x,dy=q.y-p[i].y;return{horizontal:Math.abs(dy)<1,dir:Math.abs(dy)<1?(dx>=0?'→ right':'← left'):(dy>=0?'↓ down':'↑ up')}}function dimensionSvg(p,active){let w=520,h=370,b=box(p),pad=55,s=Math.min((w-2*pad)/Math.max(1,b.w),(h-2*pad)/Math.max(1,b.h));let ox=(w-b.w*s)/2,oy=(h-b.h*s)/2;let path=p.map((v,i)=>(i?'L':'M')+(ox+v.x*s)+' '+(oy+v.y*s)).join(' ')+' Z';let labels=p.map((v,i)=>{let q=p[(i+1)%p.length],mx=ox+(v.x+q.x)*s/2,my=oy+(v.y+q.y)*s/2;return`<g><text x="${mx}" y="${my-8}" text-anchor="middle" font-size="12" font-weight="700" fill="${active===i?'#dc2626':'#17202b'}">Wall ${i+1}</text></g>`}).join('');return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="360"><path d="${path}" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>${labels}</svg>`}
function toDims(){let p=S._draw;if(!p.closed||p.length<4){document.getElementById('drawerr').innerHTML='<div class="notice">Close the shape first.</div>';return}let lens=p.map((a,i)=>Math.round(Math.hypot(p[(i+1)%p.length].x-a.x,p[(i+1)%p.length].y-a.y)));S.modal=`<div class="modalbg"><div class="modal"><h2>Room dimensions</h2><div class="small">The numbers on the left correspond directly to the numbered walls on the drawing. Click a row to highlight that wall.</div><div class="drawgrid"><div class="dimensionShape" id="dimshape">${dimensionSvg(p,-1)}</div><div><div class="field"><label>Room name</label><input id="rn" value="Room ${S.rooms.length+1}"></div><div class="dims">${lens.map((v,i)=>{let wi=wallInfo(p,i);return`<div class="dim" id="dimrow${i}" onclick="highlightWall(${i})"><div class="num">${i+1}</div><div><b>Wall ${i+1}</b><div class="dir">${wi.horizontal?'Horizontal':'Vertical'} · ${wi.dir}</div></div><input id="d${i}" type="number" min="1" value="${v}" onclick="event.stopPropagation()"></div>`}).join('')}</div><div id="dimerr" style="margin-top:9px"></div></div></div><div class="actions"><button onclick="startDraw()">Back</button><button class="primary" onclick="saveRoom()">Save room</button></div></div></div>`;render()}function highlightWall(i){document.querySelectorAll('.dim').forEach(x=>x.classList.remove('active'));let x=document.getElementById('dimrow'+i);if(x)x.classList.add('active');let el=document.getElementById('dimshape');if(el)el.innerHTML=dimensionSvg(S._draw,i)}
function buildFromDimensions(raw,d){let pts=[{x:0,y:0}];for(let i=0;i<d.length;i++){let a=raw[i],b=raw[(i+1)%raw.length],q=pts.at(-1),h=Math.abs(a.y-b.y)<Math.abs(a.x-b.x);let dx=h?(b.x>=a.x?d[i]:-d[i]):0,dy=!h?(b.y>=a.y?d[i]:-d[i]):0;if(i===d.length-1)break;pts.push({x:q.x+dx,y:q.y+dy})}let endDir=wallInfo(raw,d.length-1),last=pts.at(-1),closeX=raw[0].x===raw.at(-1).x?0:(raw[0].x>raw.at(-1).x?d.at(-1):-d.at(-1)),closeY=raw[0].y===raw.at(-1).y?0:(raw[0].y>raw.at(-1).y?d.at(-1):-d.at(-1));return pts}
function saveRoom(){let raw=S._draw,d=raw.map((_,i)=>+document.getElementById('d'+i).value);if(d.some(x=>!x||x<=0)){document.getElementById('dimerr').innerHTML='<div class="notice">Every wall needs a positive measurement.</div>';return}let hSum=0,vSum=0;for(let i=0;i<d.length;i++){let wi=wallInfo(raw,i);if(wi.horizontal)hSum+=d[i];else vSum+=d[i]}let horiz=[],vert=[];for(let i=0;i<d.length;i++){(wallInfo(raw,i).horizontal?horiz:vert).push(d[i])}let rawH=horiz.reduce((a,b)=>a+b,0),rawV=vert.reduce((a,b)=>a+b,0);if(rawH===0||rawV===0){toast('Invalid room');return}let pts=[{x:0,y:0}];for(let i=0;i<d.length-1;i++){let a=raw[i],b=raw[(i+1)%raw.length],q=pts.at(-1),wi=wallInfo(raw,i),scale=wi.horizontal?1:1;pts.push({x:q.x+(wi.horizontal?(b.x>=a.x?d[i]:-d[i]):0),y:q.y+(wi.horizontal?0:(b.y>=a.y?d[i]:-d[i]))})}let min=box(pts);pts=pts.map(q=>({x:q.x-min.minX,y:q.y-min.minY}));S.rooms.push({id:uid(),name:document.getElementById('rn').value||'Room',vertices:pts,wallDimensions:d});S.modal=null;S._draw=[];save();render();toast('Room saved')}
function editRoom(id){let r=S.rooms.find(x=>x.id===id);S.modal=`<div class="modalbg"><div class="modal"><h2>Edit room</h2><div class="field"><label>Name</label><input id="en" value="${r.name}"></div><div class="dims">${r.wallDimensions.map((v,i)=>`<div class="dim"><div class="num">${i+1}</div><div><b>Wall ${i+1}</b></div><input id="ed${i}" type="number" value="${v}"></div>`).join('')}</div><div class="actions"><button onclick="S.modal=null;render()">Cancel</button><button class="primary" onclick="applyEdit('${id}')">Save</button></div></div></div>`;render()}function applyEdit(id){let r=S.rooms.find(x=>x.id===id),d=r.wallDimensions.map((_,i)=>+document.getElementById('ed'+i).value);if(d.some(x=>!x||x<=0)){toast('Invalid dimensions');return}r.name=document.getElementById('en').value;r.wallDimensions=d;let p=r.vertices,b=box(p);let sx=b.w?Math.max(d[0],1)/b.w:1;r.vertices=p.map(v=>({x:v.x*sx,y:v.y*sx}));S.modal=null;save();render()}function newPlan(){if(confirm('Start a new project?')){S={project:'Carpet Cutting Plan',roll:4000,grid:50,snap:true,rooms:[],pieces:[],selected:null,zoom:.5,modal:null,_draw:[]};save();render()}}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}render();</script></body></html>
